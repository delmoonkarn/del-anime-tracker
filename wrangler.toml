# Cloudflare Workers config for the cloud version (server/worker.ts + D1).
# The local version (npm start / ATracker.exe) doesn't use this file.
#
#   npm run cf:db:local     create / upgrade the local D1 tables (migrations/)
#   npm run cf:seed:local   copy data/anime-tracker.db into the local D1
#   npm run cf:dev          build the frontend and run it all at http://localhost:8787
#   npm run cf:db:remote    create / upgrade the live D1 tables
#   npm run cf:deploy       build the frontend and publish the live version

# The app's address is https://<name>.<your workers.dev subdomain>.workers.dev
name = "atracker"
main = "server/worker.ts"
compatibility_date = "2026-10-01"

# Monthly backup email: 00:00 UTC on the 1st = 07:00 in Thailand.
# Needs the RESEND_API_KEY and BACKUP_EMAIL_TO secrets (see server/worker.ts).
[triggers]
crons = ["0 0 1 * *"]

# Keeps the Worker's logs (e.g. a failed backup email) viewable in the
# Cloudflare dashboard under Workers & Pages > anime-tracker > Logs.
[observability]
enabled = true

# The built frontend. /api/* goes to the Worker first; any other path that
# isn't a file in dist/ gets index.html (single-page app).
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "anime-tracker"
# Created with `wrangler d1 create anime-tracker --location apac`. Running
# your own copy? Create yours the same way and put its id here.
database_id = "b97b2a18-af52-4555-a601-a0849a3d9637"
migrations_dir = "migrations"
